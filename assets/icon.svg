<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Git Save/Load</title>
  <!-- 外圈：开口圆弧，两端都是圆角收口
       圆心 (255.5,255.5)，外半径 169.5、内半径 134.5，环厚 35
       上端 θ=53.5°，下端 θ=-11.3°（即原来三角形底边中点那条半径上）
       两端收口均为半径 17.5 的半圆 -->
  <path fill="#6D8BE5" d="M356.3 119.2
    A169.5 169.5 0 1 0 421.7 288.7
    A17.5 17.5 0 0 0 387.4 281.9
    A134.5 134.5 0 1 1 335.5 147.4
    A17.5 17.5 0 0 0 356.3 119.2 Z"/>
  <!-- 内芯：45° 圆角方块，半边长 61，圆角 22（半对角 77.2） -->
