<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>变更文件</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;overflow:hidden;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:12px;line-height:1.3;
    background:transparent;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }

  /* 浅色板 */
  :root{
    --sf-text:#16181d;
    --sf-muted:#4b5563;
    --sf-faint:#6b7280;
    /* 合并模式的两层：外层聊天底、内层每个文件一张卡的卡底。
       这两个值会被 JS 用宿主主题的 --bg / --bg-card 覆盖（见 syncTheme）。
       先给一对浅色兼容色，只能在拿不到宿主变量时才会用到。 */
    --sf-chat-bg:rgba(0,0,0,.045);
    --sf-tile-bg:#ffffff;
    --sf-card-bg:rgba(0,0,0,.035);
    --sf-card-bd:rgba(0,0,0,.07);
    --sf-card-hover:rgba(0,0,0,.055);
    --sf-add:#15803d;
    --sf-del:#b91c1c;
    --sf-btn-bg:rgba(0,0,0,.055);
    --sf-btn-hover:rgba(0,0,0,.11);
    --sf-diff-bg:rgba(0,0,0,.04);
    /* 增删行的底色与字色，跟对话卡片里那套 diff 同一个观感：色块 + 彩色文字。
       深色主题用实测像素值，浅色主题淡底深字。 */
    --sf-diff-add:var(--hana-diff-add-bg, #e6f4ea);
    --sf-diff-del:var(--hana-diff-del-bg, #fdeced);
    --sf-diff-text:var(--hana-diff-add-fg, #1a7f37);
    --sf-diff-text-del:var(--hana-diff-del-fg, #c62a2f);
    --sf-meta:rgba(0,0,0,.045);
    --sf-weak:#4b5563;
    /* 小卡描边与向外那层淡影。
       描边默认跟宿主的 --border 走（见 loadHostColors）：那是半透明色，
       叠在卡片底色上才是宿主卡片边框真正的颜色。
       拿不到时退回这里的兼容值。 */
    --sf-tile-ring:var(--border, rgba(0,0,0,.12));
    --sf-tile-glow:rgba(0,0,0,.06);
  }
  /* 深色板
     对比度全部按 WCAG AA（正文 4.5:1）挑，底色参照 hana-downloader 深色卡底 #445560。
     先前用的 #5d6779 / #f0797f / #4ec48a 在这层底上只有 2.8~3.5，看不清。 */
  body.t-dark{
    --sf-text:#e6eaf2;
    --sf-muted:#c8d4de;
    --sf-faint:#c8d4de;
    /* 拿不到宿主主题时的深色兼容色：外层偏暗、内层略亮一档。 */
    --sf-chat-bg:#3B4A54;
    --sf-tile-bg:#445560;
    --sf-card-bg:rgba(255,255,255,.045);
    --sf-card-bd:rgba(255,255,255,.09);
    --sf-card-hover:rgba(255,255,255,.07);
    --sf-add:#6ee7a8;
    --sf-del:#ffb3b6;
    --sf-btn-bg:rgba(255,255,255,.07);
    --sf-btn-hover:rgba(255,255,255,.14);
    --sf-diff-bg:rgba(0,0,0,.28);
    /* 同浅色板：色块 + 彩色文字，深色主题用实测值。 */
    --sf-diff-add:var(--hana-diff-add-bg, #354E4E);
    --sf-diff-del:var(--hana-diff-del-bg, #4A454C);
    --sf-diff-text:var(--hana-diff-add-fg, #6CE3A5);
    --sf-diff-text-del:var(--hana-diff-del-fg, #F9B0B3);
    --sf-meta:rgba(255,255,255,.05);
    --sf-weak:#bcc9d3;
    /* 描边同样跟 --border 走，不在这里写死颜色。 */
    --sf-tile-ring:var(--border, rgba(255,255,255,.14));
    --sf-tile-glow:rgba(0,0,0,.10);
  }

  #sf-root{display:flex;flex-direction:column;gap:6px;width:100%}
  /* 一行内容就是宿主那张卡的正文，外面不再包一层。
     参考 hana-downloader 的 .dl：无背景、无边框、无圆角，只留左右内边距。
     宿主已经给了卡壳，再画一层就是「卡里套卡」。 */
  .sf-item{display:flex;flex-direction:column;width:100%}
  /* 分开模式：一行就是整张卡的内容，不带自己的底色。 */
  .sf-card{
    display:flex;align-items:center;gap:10px;
    padding:2px 10px;
    min-width:0;
  }

  /* 合并模式：整块铺聊天底色，每个文件单独一张小卡。
     底色铺在 html/body 上而不是中间那个容器上：只给容器上色的话，
     iframe 四周会露出宿主卡片的底色，看起来就是一圈浅边。
     t-dark 同时加在 html 上（见 syncTheme），否则 html 只能拿到浅色兜底色，
     body 没铺满的那一条就会露出浅灰。 */
  html.sf-chat,html.sf-chat body{background:var(--sf-chat-bg)}
  html.t-dark{--sf-chat-bg:#3B4A54;--sf-tile-bg:#445560}
  #sf-root.sf-bare{
    /* 上下内边距与卡片间距取同一个值，第一张卡到顶部就和卡与卡之间一样宽。 */
    padding:13px 12px;
    border-radius:0;
    background:transparent;
    gap:13px;
  }
  #sf-root.sf-bare .sf-item{
    border-radius:9px;
    background:var(--sf-tile-bg);
    /* 展开收起时小卡自己长高：多余的差异内容由小卡露出来。
       靠它自己的圆角裁切，裁切线就是小卡底边，圆角不会掉。 */
    overflow:hidden;
    /* 描边与淡影，都跟着圆角走：
       inset 那圈是卡片内沿的 1px 描边，宽度与宿主卡片的 --border-width 一致，
       颜色用宿主的 --border（半透明，叠在卡底上得出最终色）；
       外圈是向下偏一点的淡影，向外轻微散开。
       不用 border：border 会把内容区挤小，展开收起时尺寸会跳。 */
    box-shadow:
      inset 0 0 0 var(--border-width, 1px) var(--sf-tile-ring),
      0 2px 9px var(--sf-tile-glow);
  }
  /* 合并模式下左侧三行，右侧按钮改为靠上居中。 */
  #sf-root.sf-bare .sf-card{align-items:center;padding:11px 12px}
  /* 字号只在合并模式里放大；分开模式仍用紧凑的 12/11.5。 */
  #sf-root.sf-bare .sf-chg{font-size:12.5px}
  #sf-root.sf-bare .sf-sub{font-size:12px}
  #sf-root.sf-bare .sf-acts{align-self:center}

  /* 左侧：增量计数 + 路径。合并模式下多一行文件名。 */
  .sf-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
  .sf-info.tall{gap:4px}
  /* 增删数：无序列表，每一项一条状态色点 + 数字。 */
  .sf-chg{
    display:flex;align-items:center;gap:11px;
    list-style:none;margin:0;padding:0;
    font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums;line-height:1.2;
  }
  .sf-chg .sf-stat{display:flex;align-items:center;gap:5px}
  /* 路径行：装不下时由 JS 做中间省略（保头保尾），CSS 不裁。 */
  .sf-sub{
    min-width:0;overflow:hidden;white-space:nowrap;
    font-size:11.5px;line-height:1.25;color:var(--sf-faint);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  /* 文件名：只在合并模式下出现，独立一行、字号加大。 */
  .sf-name{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:13.5px;line-height:1.3;color:var(--sf-text);font-weight:600;
  }
  .sf-dot{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--sf-faint)}
  .sf-dot.new{background:var(--sf-add)}
  .sf-dot.mod{background:#7c8cf8}
  .sf-dot.del{background:var(--sf-del)}
  .sf-add{color:var(--sf-add)}
  .sf-del{color:var(--sf-del)}
  .sf-zero{color:var(--sf-weak)}

  /* 右侧按钮 */
  .sf-acts{flex:0 0 auto;display:flex;align-items:center;gap:4px}
  .sf-btn{
    width:24px;height:24px;padding:0;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border-radius:6px;background:var(--sf-btn-bg);color:var(--sf-muted);
    transition:background .14s ease,color .14s ease;
  }
  .sf-btn:hover{background:var(--sf-btn-hover);color:var(--sf-text)}
  .sf-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sf-btn.on{background:var(--sf-btn-hover);color:var(--sf-text)}
  .sf-btn.danger{color:var(--sf-del)}
  .sf-btn.danger:hover{background:rgba(240,121,127,.16)}
  .sf-btn.confirming{
    width:auto;padding:0 8px;font-size:11px;font-weight:600;
    background:var(--sf-del);color:#fff;
  }
  .sf-btn.confirming:hover{background:var(--sf-del);filter:brightness(1.1)}
  .sf-btn:disabled{opacity:.4;cursor:default}

  /* 展开的 diff
   *
   * 横向滚动时背景条必须跟着文字走，所以结构是：外层负责滚，内层负责撑宽。
   * 内层用 inline-block，宽度由最长那行决出，再用 min-width:100% 保证短行也铺满。
   * 左右内边距放在行上而不是容器上：放在容器上的话，滚动后右侧那条背景会缺一块。
   */
  /* 展开的 diff
   *
   * 横向滚动时背景条必须跟着文字走，所以结构是：外层负责滚，内层负责撑宽。
   * 内层用 inline-block，宽度由最长那行决出，再用 min-width:100% 保证短行也铺满。
   * 左右内边距放在行上而不是容器上：放在容器上的话，滚动后右侧那条背景会缺一块。
   *
   * 展开高度直接由这个元素自身承担，不套外层裁切容器：
   * 有裁切层的话，裁切线与背景边缘是两个元素，圆角处必然差几像素（能看到直角）。
   */
  /* 展开收起不碰 diff 自身高度。
     html/body 上已经有 overflow:hidden，iframe 一变矮，
     超出部分就被 iframe 边界遮住，不需要再包一层裁切框。 */
  .sf-diff{
    margin:5px 0 0 0;padding:7px 0;border-radius:9px;
    box-sizing:border-box;
    background:var(--sf-diff-bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.55;color:var(--sf-muted);
    max-height:280px;overflow:auto;
    white-space:pre;
  }
  .sf-diff::-webkit-scrollbar{width:6px;height:6px}
  .sf-diff::-webkit-scrollbar-thumb{background:var(--sf-card-bd);border-radius:3px}
  .sf-diff::-webkit-scrollbar-track{background:transparent}
  /* 横向与纵向滚动条交汇的那一个小方块。
     不给它设背景时浏览器会用默认的白色，在深色面板右下角就是一块白。
     设成 transparent：这个区域本来就压在 diff 自己的底色上，
     透明就是直接透出那层底，与周围完全一致。
     不能拿 --sf-diff-bg 填：那是半透明色，会在已有的底色上再叠一层，变得更深。 */
  .sf-diff::-webkit-scrollbar-corner{background:transparent}
  .sf-diff-inner{display:inline-block;min-width:100%;vertical-align:top}
  .sf-diff .l{display:block;padding:0 9px}
  /* 增删行：底色块 + 彩色文字，和对话卡片里那套 diff 一致。
     增行绿字、删行粉字，各自用自己的字色。 */
  .sf-diff .l.a{background:var(--sf-diff-add);color:var(--sf-diff-text)}
  .sf-diff .l.d{background:var(--sf-diff-del);color:var(--sf-diff-text-del)}
  .sf-diff .l.h{color:var(--sf-faint)}
  .sf-diff .l.m{color:var(--sf-faint);opacity:.9}

  /* 状态行 */
  .sf-state{
    padding:14px 10px;text-align:center;
    font-size:11.5px;color:var(--sf-faint);
  }
  .sf-state b{display:block;color:var(--sf-muted);font-weight:500;margin-bottom:2px}
  .sf-sk{height:40px;border-radius:10px;background:var(--sf-meta);animation:sfp 1.4s ease-in-out infinite}
  @keyframes sfp{0%,100%{opacity:.45}50%{opacity:.85}}
</style>
</head>
<body>
  <div id="sf-root"></div>

<script type="module">
import { hana } from "./assets/sdk.js";

const root = document.getElementById("sf-root");
try { hana.ready(); } catch {}

/* ── 主题 ──
 *
 * 深色/浅色判定靠 hana.theme 快照。
 * 另外拉一次宿主主题样式表，取出 --bg（聊天底）和 --bg-card（卡底），
 * 用于合并模式画「聊天底 + 每个文件一张卡」的两层。
 * 拉不到就退回样式表里写好的兼容色，不影响使用。
 */
let hostThemeLoaded = false;

async function loadHostColors() {
  if (hostThemeLoaded) return;
  let snap = null;
  try { snap = hana.theme?.getSnapshot?.() || null; } catch { return; }
  const url = snap && snap.cssUrl;
  if (!url) return;
  hostThemeLoaded = true;
  try {
    const r = await fetch(url, { credentials: "same-origin" });
    if (!r.ok) return;
    const css = await r.text();
    const st = document.createElement("style");
    st.textContent = css;
    document.head.appendChild(st);
    if (snap.theme) document.documentElement.setAttribute("data-theme", snap.theme);
    const cs = getComputedStyle(document.documentElement);
    const bg = cs.getPropertyValue("--bg").trim();
    const bgCard = cs.getPropertyValue("--bg-card").trim();
    // 宿主的边框色不是一个实色，而是一个半透明色，
    // 它叠在卡片底色上才是屏幕上看到的那个颜色。
    // 直接把它拿过来用，小卡的描边就和宿主卡片一致，换主题自动跟着走。
    const border = cs.getPropertyValue("--border").trim();
    // diff 的增删色与宿主同源，换主题时深浅自动跟随。
    const diffAddBg = cs.getPropertyValue("--hana-diff-add-bg").trim();
    const diffAddFg = cs.getPropertyValue("--hana-diff-add-fg").trim();
    const diffDelBg = cs.getPropertyValue("--hana-diff-del-bg").trim();
    const diffDelFg = cs.getPropertyValue("--hana-diff-del-fg").trim();
    if (bg) document.body.style.setProperty("--sf-chat-bg", bg);
    if (bgCard) document.body.style.setProperty("--sf-tile-bg", bgCard);
    if (border) document.body.style.setProperty("--sf-tile-ring", border);
    if (diffAddBg) document.body.style.setProperty("--hana-diff-add-bg", diffAddBg);
    if (diffAddFg) document.body.style.setProperty("--hana-diff-add-fg", diffAddFg);
    if (diffDelBg) document.body.style.setProperty("--hana-diff-del-bg", diffDelBg);
    if (diffDelFg) document.body.style.setProperty("--hana-diff-del-fg", diffDelFg);
  } catch {}
}

function syncTheme() {
  let snap = null;
  try { snap = hana.theme?.getSnapshot?.() || null; } catch { snap = null; }
  const label = String(snap?.theme || "");
  let dark = snap?.appearance === "dark" || /dark|midnight|contrast|night|深|夜/i.test(label);
  if (!snap?.appearance && (!label || label === "inherit")) {
    dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  // t-dark 也要加在 html 上：底色变量同时被 html 和 body 用，
  // 只加在 body 上的话 html 拿的是浅色兜底值，会露出一圈浅边。
  document.documentElement.classList.toggle("t-dark", dark);
  document.body.classList.toggle("t-dark", dark);
}
syncTheme();
loadHostColors();
try {
  hana.theme?.subscribe?.(() => {
    syncTheme();
    hostThemeLoaded = false;
    loadHostColors();
  });
} catch {}

/* ── 尺寸上报 ──
 *
 * 宽度必须显式上报，宿主不读 details.card.preferredWidthPx（文档写死会被忽略）。
 * 基准是 hana-downloader：它靠 hana.ui.resize({ width, height }) 收窄到 400。
 * 容差自检同理——宿主要先把宽度采纳，卡才不会吐满整列。
 *
 * 宽度不随展开变化。实测：宿主接受放大，但不接受缩小，
 * 一旦展开变宽，收起后 iframe 会卡在宽的那个值上缩不回来。
 */
var CARD_WIDTH = 350;
// 合并模式的外框左右内边距（与 CSS 里 #sf-root.sf-bare 的 padding 保持一致）。
// 子卡宽度 = 总宽 - 外框内边距×2，所以总宽要加上这一截，子卡才与分开模式同宽。
var BARE_PAD_X = 12;

var curWidth = CARD_WIDTH;

let lastH = 0;
function measureH() {
  const h = Math.ceil(root.getBoundingClientRect().height) + 1;
  return Number.isFinite(h) && h > 0 ? h : 24;
}

/* 高度补间。
 *
 * 高度是页面自己上报的，宿主不参与插值，所以报多少它就有多高。
 * 做法：内容一次性铺满，然后逐帧报一个从矮到高的中间值。iframe 先矮于
 * 内容（裁切），再逐步露出，视觉上就是卡片长高。
 *
 * 不碰任何元素的 height，也不改宽度：上一版给 diff 节点上 CSS 过渡，
 * 每帧重排，把宽度带歪了。
 */
var HEIGHT_MS = 260;
var heightAnim = 0;
var animating = false;

function pushHeight(h) {
  try { hana.ui?.resize?.({ width: curWidth, height: h }); } catch {}
  try { window.parent.postMessage({ type: "hana.card-resize", width: curWidth, height: h }, "*"); } catch {}
}

/* 缓动：smoothstep，两端慢中间快，视觉上比 easeOutCubic 更像“拉开”而不是“弹出来”。 */
function easeS(p) {
  var x = Math.min(1, Math.max(0, p));
  return x * x * (3 - 2 * x);
}

/* 高度补间。
 *
 * 用 requestAnimationFrame 驱动，跟屏幕刷新对齐（60Hz 下就是 60 帧），
 * 而不是 setInterval(16) —— 后者与刷新不同步，会出现掉帧和抖动。
 *
 * 时长按帧数算：DUR_MS 不变时实际帧数取决于刷新率，这里以时间为主，
 * 每帧的递进由时间戳决定，所以掉帧也不会拖慢整体时长。
 */
/* 展开收起的高度过渡。
 *
 * 两层同时长高，看起来才是“里面的卡也在展开”：
 *   1) 宿主那一层：逐帧上报整卡高度，卡片下边缘往下让。
 *   2) 合并模式里的小卡：逐帧改它自己的高度，它的底边在走。
 *      小卡有圆角和底色，多余内容由它自己裁（overflow:hidden），
 *      裁切线就是它的底边，圆角不会掉。
 * 分开模式没有小卡底色，只有宿主的 iframe 在裁，不需要第二层。
 *
 * diff 自身高度始终不动，只是逐步被露出来。
 *
 * opening=true  从“不带 diff 的高度”涨到完整高度
 * opening=false 从完整高度收到底
 */
function animateDiff(el, opening, done) {
  if (!el) return;
  if (heightAnim) {
    try { cancelAnimationFrame(heightAnim); } catch {};
    heightAnim = 0;
  }

  // diff 的完整可见高度（已含 max-height 封顶）。
  var full = Math.ceil(el.getBoundingClientRect().height) || 0;
  // 整页完整高度，减掉 diff 就是“没展开时”的底子。
  var totalFull = Math.ceil(root.getBoundingClientRect().height) || 0;
  var base = Math.max(1, totalFull - full);

  runAnim(full, base, opening, isGroupedMode() ? el.parentElement : null, done);
}

/* 当前是不是合并模式。子卡有自己的底色和圆角时才需要第二层动画。 */
function isGroupedMode() {
  try {
    return root.classList.contains("sf-bare");
  } catch (e) {
    return false;
  }
}

/* 真正跑补间。
 * full 是 diff 完整高度，base 是不带 diff 的底子高度，
 * tile 是合并模式里包住 diff 的那张子卡（分开模式没有，传 null）。
 */
function runAnim(full, base, opening, tile, done) {

  // 子卡里除 diff 以外那部分（文字行、内边距）的高度。
  // 子卡完整高度 = 这一截 + diff 完整高度。
  var tileBase = 0;
  if (tile) {
    var th = Math.ceil(tile.getBoundingClientRect().height) || 0;
    tileBase = Math.max(0, th - full);
  }

  var to = opening ? base + full : base;
  var from = opening ? base : base + full;
  var tileFrom = opening ? tileBase : tileBase + full;
  var tileTo = opening ? tileBase + full : tileBase;

  if (Math.abs(to - from) < 1) {
    reportSize(true);
    if (done) done();
    return;
  }

  animating = true;
  // 先把卡片按到起始高度再开跑。
  //
  // 元素刚 append 时页面已经是完整高度，若等到第一帧才推起始值，
  // 中间会先闪一帧完整高度，看起来就是“先弹开再收起再展开”。
  pushHeight(from);
  if (tile) tile.style.height = tileFrom + "px";
  var started = 0;
  function step(ts) {
    if (!started) started = ts;
    var p = Math.min(1, (ts - started) / HEIGHT_MS);
    var e = easeS(p);
    var h = Math.round(from + (to - from) * e);
    pushHeight(h);
    // 子卡同步长高，它自己的底边在走，圆角和底色都跟着走。
    if (tile) tile.style.height = Math.round(tileFrom + (tileTo - tileFrom) * e) + "px";
    if (p < 1) {
      heightAnim = requestAnimationFrame(step);
    } else {
      heightAnim = 0;
      animating = false;
      // 子卡交回 auto，让它回到由内容撑开的自然高度。
      if (tile) tile.style.height = "";
      reportSize(true);
      if (done) done();
    }
  }
  heightAnim = requestAnimationFrame(step);
}

function reportSize(force) {
  try {
    if (animating) return;
    const h = measureH();
    if (!force && h === lastH) return;
    lastH = h;
    pushHeight(h);
  } catch {}
}

if (typeof ResizeObserver !== "undefined") {
  try { new ResizeObserver(() => reportSize(false)).observe(root); } catch {}
}
reportSize(true);

// 启动期收敛：宿主要把宽度真正采纳（实测是 min(想要, 信封上限)），
// 没到位就补报几轮；到位后停手，不再打扰通道。
(function bootSettle() {
  if (typeof setInterval !== "function") return;
  var tries = 0;
  var adopted = function () {
    try { return Math.abs(window.innerWidth - curWidth) <= 2; } catch (e) { return true; }
  };
  var timer = setInterval(function () {
    tries += 1;
    if (adopted() || tries > 12) { clearInterval(timer); return; }
    reportSize(true);
  }, 180);
  try {
    window.addEventListener("resize", function () { if (!adopted()) reportSize(true); });
  } catch (e) {}
})();

/* ── 工具 ── */
const ESC = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const ICON_DIFF = '<svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h4"/><path d="M15 3h4a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4"/><path d="M12 3v18"/></svg>';
/* 撤回图标：实心回转箭头。

   原来的描边写法两段弧拼不出清晰的箭头，换成实心图标。
   实心块必须自己带 fill，否则会被 .sf-btn svg 的 fill:none 抹平。

   加粗与圆角：图形是实心块，改 stroke-width 对填充没作用。
   做法是同色描边叠在填充上，向外胀一半宽度，线条就变粗。
   stroke-linejoin/linecap 给 round，箭头的三个尖角自然变圆。

   转角：实测开口原本朝 120°（0°=右，90°=正下），偏右 30°。
   逆时针转 28°，开口落到 92°，基本正对下方，还留一点斜度。

   尾巴与箭头：尾端沿弧线切线往外伸 70，尾巴变长。
   箭头五个顶点整体沿屏幕斜上挪 40，形状一点没动，只是位置退了。
   路径已由相对坐标展开成绝对坐标，否则改一个点会带动后面所有段平移。

   viewBox 是旋转 + 改造后重新量的，不是算出来的。
   数字带三位小数，是展开时的精度，不影响渲染。 */
const ICON_UNDO = '<svg viewBox="170 220 696 646" preserveAspectRatio="xMidYMid meet"><g transform="rotate(-28 502 576)"><path d="M341.470 420.433L477.924 331.264C604.615 258.105 764.587 298.098 835.300 420.580C905.956 543.004 860.615 701.554 733.924 774.656L530.620 892.024L505.020 847.651L630.745 775.117L708.324 730.340C809.643 671.801 845.995 544.996 789.390 447.033C732.843 349.070 604.843 317.099 503.524 375.580L486.571 385.422L367.070 464.749L424.641 564.419L172.737 550.709L286.800 325.656L341.470 420.433Z" fill="currentColor" stroke="currentColor" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/></g></svg>';

function api(path, init) {
  return hana.api.fetch(path, init).then((r) => r.json());
}

function statusKey(s) {
  if (s === "新文件" || s === "新增") return "new";
  if (s === "删除") return "del";
  if (s === "修改" || s === "重命名" || s === "复制") return "mod";
  if (s === "冲突") return "del";
  return "";
}

/* ── diff 渲染 ── */
function renderDiff(text) {
  if (!text) return '<span class="l m">这个文件没有可显示的差异</span>';
  const lines = String(text).split("\n").map((line) => {
    let cls = "l";
    if (line.startsWith("@@") || line.startsWith("---") || line.startsWith("+++ ") || line.startsWith("diff ") || line.startsWith("index ")) cls = "l h";
    else if (line.startsWith("+")) cls = "l a";
    else if (line.startsWith("-")) cls = "l d";
    return `<span class="${cls}">${ESC(line) || " "}</span>`;
  }).join("");
  // 内层包一层：横向滚动时由它撑出总宽，每行背景才能铺满整行。
  return `<div class="sf-diff-inner">${lines}</div>`;
}

/* ── 建卡 ── */

/**
 * 中间省略：装不下时保留头尾，中间换成 …。
 *
 * 不用 CSS 的 text-overflow: ellipsis：那是末尾省略，长路径会把文件名切掉，
 * 剩下的都是前缀。不用固定字符数：卡宽由宿主决定，写死长度必然在某些场景溢出。
 */
function fitPath(el, text) {
  el.textContent = text;
  el.title = text;
  if (!el.clientWidth) return;
  if (el.scrollWidth <= el.clientWidth) return;

  const fits = (s) => {
    el.textContent = s;
    return el.scrollWidth <= el.clientWidth;
  };

  let lo = 0;
  let hi = text.length;
  let best = "…";
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const headLen = Math.max(1, Math.floor(mid * 0.4));
    const tailLen = Math.max(1, mid - headLen);
    const s = `${text.slice(0, headLen)}…${text.slice(text.length - tailLen)}`;
    if (fits(s)) {
      best = s;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  el.textContent = best;
}

function buildCard(f, opts = {}) {
  // 合并模式下宿主标题只写「N 个文件」，看不出具体是哪个文件，
  // 所以每行自己带一遍文件名。分开模式下标题就是文件名，不再重复。
  const showName = opts.showName === true;
  const key = statusKey(f.status);
  const wrap = document.createElement("div");
  wrap.className = "sf-item";
  wrap.dataset.file = f.relative || f.name;
  wrap.__file = f;

  const addTxt = f.binary ? "二进制" : `+${f.added}`;
  const delTxt = f.binary ? "" : `-${f.deleted}`;

  // 左边三行（合并模式）：文件名独立一行、增删各一项、路径一行。
  // 分开模式下只保留后两行的紧凑形式：标题已经写了文件名。
  wrap.innerHTML =
    '<div class="sf-card">'
    +  '<div class="sf-info' + (showName ? " tall" : "") + '">'
    +    (showName
          ? `<div class="sf-name" title="${ESC(f.name)}">${ESC(f.name)}</div>`
          : "")
    +    '<ul class="sf-chg">'
    +      `<li class="sf-stat">`
    +        (key ? `<span class="sf-dot ${key}"></span>` : '<span class="sf-dot"></span>')
    +        `<span class="${f.binary ? "sf-zero" : "sf-add"}">${ESC(addTxt)}</span>`
    +      "</li>"
    +      (delTxt ? `<li class="sf-stat"><span class="${f.deleted ? "sf-del" : "sf-zero"}">${ESC(delTxt)}</span></li>` : "")
    +    "</ul>"
    +    '<div class="sf-sub"></div>'
    +  "</div>"
    +  '<div class="sf-acts">'
    +    `<button class="sf-btn" data-act="diff" title="查看变更">${ICON_DIFF}</button>`
    +    (f.untracked || !f.inRepo
          ? `<button class="sf-btn" data-act="revert" title="新文件没有可还原的版本" disabled>${ICON_UNDO}</button>`
          : `<button class="sf-btn danger" data-act="revert" title="回退这个文件的未提交改动">${ICON_UNDO}</button>`)
    +  "</div>"
    + "</div>";

  const diffBtn = wrap.querySelector('[data-act="diff"]');
  const revertBtn = wrap.querySelector('[data-act="revert"]');

  // diff 预取：卡片建好就去拉，点开时直接贴出来，不用等。
  // 拉不到就留个空标记，点开时再试一次并显示错误。
  let diffPromise = null;
  // settled：预取是否已有结果。预取完成时同步置位，点开时据此决定要不要等。
  let settled = false;
  function prefetchDiff() {
    if (diffPromise) return diffPromise;
    const q = new URLSearchParams({
      file: f.relative || f.name,
      repo: f.repo || "",
      untracked: f.untracked ? "1" : "0",
    });
    diffPromise = api("/api/show-files/diff?" + q.toString()).catch((e) => ({
      ok: false,
      message: e && e.message ? e.message : String(e),
    }));
    diffPromise.then(
      () => { settled = true; },
      () => { settled = true; },
    );
    return diffPromise;
  }
  // 空闲时开始预取；多张卡时错开，不要一起挤到后端。
  try {
    const delay = 60 + Math.floor(Math.random() * 120);
    setTimeout(prefetchDiff, delay);
  } catch {}

  let diffEl = null;
  diffBtn.addEventListener("click", async () => {
    if (diffEl) {
      // 收起：只靠高度上报。diff 节点在收的途中不删，
      // 它在 iframe 里位置不动，只是被 iframe 变矮的底边盖住。
      const el = diffEl;
      diffEl = null;
      diffBtn.classList.remove("on");

      animateDiff(el, false, function () {
        el.remove();
        reportSize(true);
      });
      return;
    }

    diffBtn.classList.add("on");

    // 先把内容拿到手再插入。
    //
    // 之前是先插一个“读取中”占位、对着它做补间，等真内容到了再直接跳高。
    // 占位只有一行高（31px），补间在 31 像素里来回走，肉眼看不见，
    // 真内容到位那一下又是个瞬间跳变，合起来就是“没动效”。
    let cached = settled ? await prefetchDiff() : null;
    if (!(cached && cached.ok)) {
      try {
        cached = await prefetchDiff();
      } catch (e) {
        cached = { ok: false, message: e && e.message ? e.message : String(e) };
      }
    }

    diffEl = document.createElement("div");
    diffEl.className = "sf-diff";
    if (cached && cached.ok) {
      diffEl.innerHTML = renderDiff(cached.diff)
        + (cached.truncated ? '<span class="l m">… 内容过长，只显示前面一部分</span>' : "");
    } else {
      diffEl.innerHTML = `<span class="l m">${ESC((cached && cached.message) || "读不到差异")}</span>`;
    }

    // 直接挂上。不锁高度、不加图层：
    // 内容本来就是完整高度，靠上报的卡高逐步变大把下半截露出来。
    wrap.appendChild(diffEl);

    animateDiff(diffEl, true, function () {});
  });

  if (!revertBtn.disabled) {
    let arming = false;
    let timer = null;
    revertBtn.addEventListener("click", async () => {
      if (!arming) {
        arming = true;
        revertBtn.classList.add("confirming");
        revertBtn.innerHTML = "确认回退";
        timer = setTimeout(() => {
          arming = false;
          revertBtn.classList.remove("confirming");
          revertBtn.innerHTML = ICON_UNDO;
        }, 4000);
        return;
      }
      clearTimeout(timer);
      revertBtn.disabled = true;
      revertBtn.classList.remove("confirming");
      revertBtn.innerHTML = "…";
      try {
        const res = await api("/api/show-files/revert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file: f.relative || f.name, repo: f.repo || "" }),
        });
        if (res && res.ok) {
          wrap.querySelector(".sf-chg").innerHTML = '<span class="sf-zero">已回退</span>';
          wrap.querySelector(".sf-dot")?.classList.remove("new", "mod", "del");
          revertBtn.remove();
          if (diffEl) { diffEl.remove(); diffEl = null; }
          reportSize(true);
        } else {
          revertBtn.disabled = false;
          revertBtn.innerHTML = ICON_UNDO;
          arming = false;
          alert((res && res.message) || "回退失败");
        }
      } catch (e) {
        revertBtn.disabled = false;
        revertBtn.innerHTML = ICON_UNDO;
        arming = false;
        alert("回退失败：" + (e && e.message ? e.message : e));
      }
      reportSize(true);
    });
  }

  return wrap;
}

/**
 * 给路径行填内容。
 *
 * 挂载前宽度为 0，算不出要不要省略，所以得等宿主给宽后再算；
 * 卡宽会随窗口变化，也要跟着重算。
 */
function paintPaths() {
  for (const wrap of root.querySelectorAll(".sf-item")) {
    const f = wrap.__file;
    const el = wrap.querySelector(".sf-sub");
    if (!f || !el) continue;
    fitPath(el, f.display || f.relative || f.name);
  }
  reportSize(true);
}

/* ── 主流程 ── */
function showState(title, detail) {
  root.innerHTML = `<div class="sf-state"><b>${ESC(title)}</b>${ESC(detail || "")}</div>`;
  reportSize(true);
}

/**
 * 认出自己这张卡。
 *
 * 宿主不会把工具参数传进 iframe，但会把自己的 cardInstanceId 吐在
 * hana.surface.getContext() 里。工具已经按这个 id 各写了一份数据，
 * 所以一个文件一张卡时，每张卡只拿自己那一个文件，不会串。
 */
async function selfCardId() {
  for (let i = 0; i < 12; i += 1) {
    let ctx = null;
    try { ctx = hana.surface?.getContext?.() || null; } catch (e) { ctx = null; }
    const id = ctx && ctx.cardInstanceId ? String(ctx.cardInstanceId) : "";
    if (id) return id;
    await new Promise((r) => setTimeout(r, 150));
  }
  return "";
}

/* 首帧骨架：必须在 boot 开始之前画。
 * boot 是 async 的，如果在它后面同步覆盖 root，会把已经画好的内容冲掉。 */
root.innerHTML = '<div class="sf-sk"></div><div class="sf-sk"></div>';
reportSize(true);

(async function boot() {
  const cardId = await selfCardId();
  const qs = cardId ? `?card=${encodeURIComponent(cardId)}` : "";

  let res;
  try {
    res = await api(`/api/show-files${qs}`);
  } catch (e) {
    showState("读取失败", e && e.message ? e.message : String(e));
    return;
  }

  if (!res || !res.ok) {
    showState("没取到数据", (res && res.message) || "");
    return;
  }

  const data = res.data || {};
  const files = Array.isArray(data.files) ? data.files : [];
  if (!files.length) {
    showState("没有文件", "");
    return;
  }

  // grouped：一张卡里纵向排全部文件（默认）。
  // per-file：这一张卡只负责一个文件。
  // data.mode 由工具写入，总会有值；万一缺了就当合并处理。
  //
  // 设置在合并、但这次只有一张卡的内容时，不摆合并那套外框：
  // 一张卡再套一层聊天底加子卡，外面看就是卡里套卡，多一圈多余的边。
  // 这时候直接按分开模式渲染，看起来就和单文件卡一致。
  const modeGrouped = data.mode !== "per-file";
  const isGrouped = modeGrouped && files.length > 1;
  const picked = modeGrouped ? files : files.slice(0, 1);
  // 合并模式下每行要自带文件名，因为标题只有「N 个文件」。
  const showName = isGrouped;

  // 合并模式：整块铺聊天背景，每个文件单独一张小卡，观感接近分开展示。
  // 分开模式：一行就是整张卡的正文，不加任何自己的底色。
  const bare = isGrouped;
  root.classList.toggle("sf-bare", bare);
  // 底色要铺在 html 上，才能盖满整个 iframe，不留出宿主的卡底色。
  document.documentElement.classList.toggle("sf-chat", bare);
  // 合并模式多一圈外框，总宽要加上那圈，子卡宽度才与分开模式一致。
  curWidth = isGrouped ? CARD_WIDTH + BARE_PAD_X * 2 : CARD_WIDTH;



  reportSize(true);





  root.innerHTML = "";
  for (const f of picked) root.appendChild(buildCard(f, { showName }));

  // 宽度要等宿主把 iframe 布好才准，所以先用 rAF 试一次，
  // 再用一个短定时器装一次底（首帧常常仍是 0 宽）。
  requestAnimationFrame(paintPaths);
  setTimeout(paintPaths, 120);
  setTimeout(paintPaths, 400);
})();

// 卡宽变了（窗口缩放 / 聊天列宽变化）就重算省略
try {
  window.addEventListener("resize", () => requestAnimationFrame(paintPaths));
} catch (e) {}
</script>
</body>
</html>
